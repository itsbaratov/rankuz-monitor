name: watch rank.uz

on:
  schedule:
    # Drop window (est. 23 Sep): every 5 min, offset off :00 and :05-multiples of
    # the hour top. GitHub delivers only ~14% of scheduled runs on this repo, so
    # asking for 288/day is what actually yields a check every 30-60 min. Public
    # repo => unmetered minutes, so the request rate costs nothing.
    # After the domain resolves, drop back to "13,43 * * * *".
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Force the daily summary now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch-rank-uz
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the registry
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_DOMAIN: rank.uz
        run: python3 check.py ${{ inputs.daily && '--daily' || '' }}

      - name: Save state
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              exit 0
            fi
            sleep 5
          done
          # never fail the run over a push race - the check itself already ran
          echo "could not push state.json"
