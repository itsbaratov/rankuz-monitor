name: watch rank.uz

on:
  schedule:
    # This is only a KEEPALIVE now. GitHub delivers ~6-7 of these a day no matter
    # what rate we ask for (measured: 288 requests/day -> 6 runs). Each delivered
    # run starts a 5.5h loop that checks every 5 minutes, so the cron only has to
    # fire once per loop length to keep the chain unbroken - which it comfortably
    # does. This is how we get real 5-minute checks out of a throttled scheduler.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Force the daily summary on the first check"
        type: boolean
        default: false
      duration:
        description: "Loop length in seconds (default 19800 = 5h30m). Use 900 to smoke-test."
        type: string
        default: "19800"

permissions:
  contents: write

concurrency:
  group: watch-rank-uz
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # under GitHub's 6h hard cap
    steps:
      - uses: actions/checkout@v4

      - name: Watch loop - check every 5 min for 5.5h
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_DOMAIN: rank.uz
          INTERVAL: "300"
          DURATION: ${{ inputs.duration || '19800' }}   # default 5h30m
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_state () {
            git add state.json 2>/dev/null || return 0
            git diff --cached --quiet 2>/dev/null && return 0
            git commit -q -m "state: $(date -u +%FT%TZ)" 2>/dev/null || return 0
            for _ in 1 2 3; do
              if git pull --rebase --autostash -q && git push -q; then return 0; fi
              sleep 5
            done
            echo "  (state push failed - alert already sent, continuing)"
          }

          sig () {
            python3 -c "import json;d=json.load(open('state.json'));s=d.get('snapshot') or {};print(s.get('state'),s.get('status_text'),s.get('expires'),len(d.get('changes',[])),d.get('last_report_date'))" 2>/dev/null || echo unreadable
          }

          END=$(( $(date +%s) + DURATION ))
          LAST=""; i=0; pushes=0
          FLAG="${{ inputs.daily && '--daily' || '' }}"

          while [ "$(date +%s)" -lt "$END" ]; do
            i=$(( i + 1 ))
            echo "--- check $i at $(date -u +%H:%M:%S) UTC ---"
            python3 check.py $FLAG || echo "  check.py exited non-zero"
            FLAG=""
            NOW="$(sig)"
            # push immediately when anything meaningful moved, else every ~2h
            if [ "$NOW" != "$LAST" ] || [ $(( i % 24 )) -eq 0 ]; then
              push_state; pushes=$(( pushes + 1 )); LAST="$NOW"
            fi
            if [ "$(date +%s)" -lt "$END" ]; then sleep "$INTERVAL"; fi
          done

          push_state
          echo "loop finished: $i checks, $pushes state pushes"
